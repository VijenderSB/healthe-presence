<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Transess</title>
    <style>
      :root { --ink: #0f172a; --muted: #64748b; --teal: #0a9396; --orange: #ea580c; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg); color: var(--ink);
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .card {
        background: var(--card); border: 1px solid var(--border); border-radius: 20px;
        max-width: 520px; width: 100%; padding: 48px 32px; text-align: center;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.06);
      }
      .brand { font-weight: 800; letter-spacing: 0.5px; color: var(--teal); font-size: 20px; margin-bottom: 24px; }
      .code { font-size: 72px; font-weight: 800; line-height: 1; color: var(--teal); margin: 0; }
      h1 { font-size: 24px; margin: 16px 0 8px; }
      p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
      .btn {
        display: inline-block; background: var(--orange); color: #fff; text-decoration: none;
        font-weight: 700; padding: 14px 28px; border-radius: 12px; transition: opacity .2s;
      }
      .btn:hover { opacity: 0.9; }
      .links { margin-top: 24px; font-size: 14px; }
      .links a { color: var(--teal); text-decoration: none; margin: 0 10px; }
      .links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">TRANSESS</div>
      <p class="code">404</p>
      <h1>Page Not Found</h1>
      <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
      <a class="btn" href="/">Back to Home</a>
      <div class="links">
        <a href="/services">Services</a>
        <a href="/cities">Cities</a>
        <a href="/contact">Contact</a>
      </div>
    </div>
  </body>
</html>
